name: Sync Resume with GitHub Activity

on:
  push:
    branches: [master]
    paths:
      - "Muhammad_Hussain_Resume.tex"
      - "scripts/**"
  schedule:
    # 03:00 UTC daily = 08:00 PKT
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      skip_ai:
        description: "Skip Gemini analysis, just recompile the PDF from the current .tex (use after a manual .tex edit)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Analyze GitHub activity and refresh resume
        if: github.event.inputs.skip_ai != 'true'
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_USERNAME: MuhammadHussain2004
        run: python scripts/sync_resume.py

      - name: Detect shared analysis changes
        if: github.event.inputs.skip_ai != 'true'
        run: |
          if git diff --quiet -- data/repo-analysis.json; then
            echo "ANALYSIS_CHANGED=false" >> "$GITHUB_ENV"
          else
            echo "ANALYSIS_CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Force recompile (manual .tex edit)
        if: github.event.inputs.skip_ai == 'true'
        run: echo "RESUME_CHANGED=true" >> "$GITHUB_ENV"

      - name: Compile PDF
        if: env.RESUME_CHANGED == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Muhammad_Hussain_Resume.tex

      - name: Commit and push updated resume
        if: env.RESUME_CHANGED == 'true' || env.ANALYSIS_CHANGED == 'true'
        run: |
          git config user.name "resume-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Muhammad_Hussain_Resume.tex Muhammad_Hussain_Resume.pdf data/repo-analysis.json
          if [ "${{ github.event.inputs.skip_ai }}" = "true" ]; then
            git commit -m "chore: recompile PDF from manually edited resume"
          else
            git commit -m "chore: auto-sync resume with latest GitHub activity"
          fi
          git push

      - name: Upload latest PDF to Google Drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/upload_to_gdrive.py Muhammad_Hussain_Resume.pdf

      - name: Trigger portfolio and profile synchronization
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          gh api --method POST repos/MuhammadHussain2004/My-Portfolio/dispatches -f event_type=resume_updated
          gh api --method POST repos/MuhammadHussain2004/MuhammadHussain2004/dispatches -f event_type=resume_updated
